<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtletasPro - Panel Administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-container">
    
    <!-- Sidebar Lateral -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>⚡ AtletasPro</h2>
            <span>Panel Administrativo</span>
        </div>
        
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active">📊 Nómina General</a>
            <a href="#" class="nav-item">⚠️ Alertas de Pagos</a>
        </nav>

        <!-- Botón de Registro que abre el modal -->
        <div class="sidebar-action">
            <button onclick="abrirModal()" class="btn-nuevo">+ Nuevo Atleta</button>
        </div>
    </aside>

    <!-- Área Principal de Trabajo -->
    <main class="main-content">
        <header class="top-bar">
            <h1>Control de Alumnos</h1>
            <div class="top-bar-actions">
                <div class="search-box">
                    🔍 <input type="text" id="buscador" oninput="filtrarAtletas()" placeholder="Buscar por nombre, cédula o deporte...">
                </div>
            </div>
        </header>

        
       <!-- SECCIÓN DE MÉTRICAS Y BOTONES DE EXPORTACIÓN -->
<div class="panel-superior-datos">
    <section class="metrics-grid">
        <div class="metric-card">
            <span>Total Atletas</span>
            <h3 id="contadorAtletas">0</h3>
        </div>
        <div class="metric-card solventes">
            <span>Atletas Solventes</span>
            <h3 id="contadorSolventes">0</h3>
        </div>
        <div class="metric-card morosos">
            <span>Atletas Morosos</span>
            <h3 id="contadorMorosos">0</h3>
        </div>
    </section>

    <!-- Botones de Exportación reubicados -->
    <div class="export-buttons-group">
        <button onclick="exportarExcel()" class="btn-exportar excel">📊 Exportar Excel</button>
        <button onclick="exportarPDF()" class="btn-exportar pdf">📄 Exportar PDF</button>
    </div>
</div>


        <!-- Tabla / Listado de Atletas -->
        <section class="card-tabla-workspace">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Nombre Completo</th>
                            <th>Edad (Cat.)</th>
                            <th>Teléfono</th>
                            <th>Deporte</th>
                            <th>Estatus Pago</th>
                            <th style="text-align: center;">Asist.</th>
                            <th style="text-align: right;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAtletas">
                        <!-- Carga dinámica desde Firebase -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

</div>

<!-- VENTANA FLOTANTE (MODAL) DE REGISTRO / EDICIÓN -->
<div id="modalRegistro" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="tituloModal">Registrar Nuevo Atleta</h3>
            <button onclick="cerrarModal()" class="btn-cerrar">&times;</button>
        </div>
        
        <div class="form-grid">
    <div class="input-group">
        <label>Cédula / ID:</label>
        <input type="text" id="cedula" placeholder="Ej. V-25123456">
    </div>
    <div class="input-group">
        <label>Nombre Completo:</label>
        <input type="text" id="nombre" placeholder="Ej. Juan Pérez">
    </div>
    <div class="input-group">
        <label>Correo Electrónico:</label>
        <input type="email" id="correo" placeholder="ejemplo@correo.com">
    </div>
    <div class="input-group">
        <label>Fecha de Inscripción:</label>
        <input type="date" id="fechaInscripcion">
    </div>
    <div class="input-group">
        <label>Edad:</label>
        <input type="number" id="edad" placeholder="Ej. 15">
    </div>
    <div class="input-group">
        <label>Teléfono:</label>
        <input type="text" id="telefono" placeholder="Ej. 0414-1234567">
    </div>
    <div class="input-group full-width">
        <label>Disciplina:</label>
        <select id="deporte">
            <option value="Atletismo">Atletismo</option>
            <option value="Natación">Natación</option>
            <option value="Gimnasia">Gimnasia</option>
            <option value="Baloncesto">Baloncesto</option>
        </select>
    </div>
</div>


        <div class="modal-footer">
            <button onclick="cerrarModal()" class="btn-secundario">Cancelar</button>
            <button id="btnGuardar" onclick="procesarFormulario()" class="btn-primary">Guardar Atleta</button>
        </div>
    </div>
</div>

<!-- Lógica de Firebase -->
<script type="module" src="app.js"></script>

<!-- Librería para generar PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
